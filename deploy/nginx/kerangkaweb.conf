# Template: apply only to the named application's vhost. Adjust absolute paths/pool.
server {
    listen 80;
    server_name kerangkaweb.test;
    server_tokens off;
    return 308 https://kerangkaweb.test$request_uri;
}
server {
    listen 443 ssl;
    server_name kerangkaweb.test;
    root "D:/DATA/SERVER_DEVARON/Devaron/www/kerangkaweb/public";
    index index.php;
    autoindex off;
    server_tokens off;
    client_max_body_size 2m;
    ssl_certificate "D:/DATA/SERVER_DEVARON/Devaron/etc/ssl/kerangkaweb.test.crt";
    ssl_certificate_key "D:/DATA/SERVER_DEVARON/Devaron/etc/ssl/kerangkaweb.test.key";
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ /\. { deny all; }
    location = /index.php {
        fastcgi_pass php_pool_9251;
        include "D:/DATA/SERVER_DEVARON/Devaron/bin/nginx/nginx-1.28.2/conf/fastcgi_params";
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php(?:/|$) { return 404; }
}
